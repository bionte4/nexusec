[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .venv,
    venv,
    __pycache__,
    .git,
    alembic/versions,
    backend/.venv,
    frontend,
    node_modules
per-file-ignores =
    __init__.py:F401
    workers/celery_app.py:E402
    database/alembic/env.py:E402

[tool:pytest]
asyncio_mode = auto
