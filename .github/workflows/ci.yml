name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Lint (Black + Flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Black (check)
        working-directory: ${{ github.workspace }}
        run: |
          black --check --diff \
            backend/app \
            workers \
            scanners/python/nexusec_scanner \
            database/alembic

      - name: Flake8
        working-directory: ${{ github.workspace }}
        run: |
          flake8 backend/app workers scanners/python/nexusec_scanner \
            --config=setup.cfg

  backend-test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          APP_ENV: test
          DEBUG: "false"
        run: pytest -q --tb=short

  security:
    name: Security (pip-audit + Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: pip-audit (dependency CVEs)
        run: pip-audit -r requirements.txt

      - name: Bandit (SAST)
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          bandit -r backend/app workers scanners/python/nexusec_scanner \
            -ll -q -x '**/tests/**'

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t nexusec-api:ci .

      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t nexusec-worker:ci .

      - name: Build scanner image
        run: docker build -f infra/docker/Dockerfile.scanner -t nexusec-scanner:ci .
